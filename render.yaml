# ============================================================
# render.yaml - Infrastructure as Code pour Render
# Déploiement automatique du backend Flask + Frontend React
# ============================================================

services:
  # Backend Flask API (serves both API and frontend static files)
  - type: web
    name: douanesci-convocation
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    numInstances: 1
    
    # Variables d'environnement pour le backend
    envVars:
      # Auto-sync from secrets.env (add secrets.env to .gitignore)
      - key: DB_HOST
        sync: true
      - key: DB_PORT
        sync: true
      - key: DB_USER
        sync: true
      - key: DB_PASSWORD
        sync: true
      - key: DB_NAME
        sync: true
      - key: JWT_SECRET_KEY
        sync: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: PORT
        value: "5000"
      # Fallback: Manual dashboard if sync fails
