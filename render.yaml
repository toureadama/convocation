# ============================================================
# render.yaml - Infrastructure as Code pour Render
# Déploiement automatique du backend Flask + Frontend React
# ============================================================

services:
  # Backend Flask API (serves both API and frontend static files)
  - type: web
    name: douanesci-convocation
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    healthCheckPath: /health
    numInstances: 1
    
    # Variables d'environnement pour le backend
    envVars:
      # Auto-sync from secrets.env (add secrets.env to .gitignore)
      - key: DB_HOST
        sync: true
      - key: DB_PORT
        sync: true
      - key: DB_USER
        sync: true
      - key: DB_PASSWORD
        sync: true
      - key: DB_NAME
        sync: true
      - key: JWT_SECRET_KEY
        sync: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: PORT
        value: "10000"
      - key: LO_PATH
        value: /usr/bin/libreoffice
      - key: TMPDIR
        value: /tmp
      - key: FONTCONFIG_PATH
        value: /etc/fonts
      - key: FONTCONFIG_FILE
        value: /etc/fonts/fonts.conf
      - key: CLOUDINARY_CLOUD_NAME
        value: dkohn8rjb
      - key: CLOUDINARY_API_KEY
        value: 627145979542462
      - key: CLOUDINARY_API_SECRET
        value: sgRydI4-BQDXZIcd9u9o7IVNC7w

    # Bash handled by Docker CMD

    # Install required dependencies at runtime
    startCommand: |
      mkdir -p /app/output && chmod 777 /app/output &&
      echo "Output dir ready. LibreOffice from Dockerfile."
